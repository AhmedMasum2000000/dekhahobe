<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Boot guard. GitHub Pages lets browsers reuse this page for 10 minutes, so after an
      // update a cached copy can point at code files that no longer exist, which used to
      // leave a blank white page. If one of our files fails to load, fetch a fresh copy once.
      (function () {
        var KEY = 'bpop:reloaded-at';
        window.__bpopFreshReload = function () {
          try {
            var last = Number(sessionStorage.getItem(KEY) || 0);
            if (Date.now() - last < 30000) return false;
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch (e) {}
          if (/\.github\.io$/.test(location.hostname)) {
            var u = new URL(location.href);
            u.searchParams.set('v', Date.now().toString(36)); // new URL skips the stale cache
            location.replace(u.href);
          } else location.reload();
          return true;
        };
        window.addEventListener('error', function (e) {
          var t = e.target;
          var url = t && (t.src || t.href);
          if (url && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && /\/assets\//.test(url)) window.__bpopFreshReload();
        }, true);
        setTimeout(function () {
          var b = document.getElementById('boot-retry');
          if (!b || !document.getElementById('boot')) return;
          b.hidden = false;
          b.onclick = function () { if (!window.__bpopFreshReload()) location.reload(); };
        }, 8000);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      // Apply the saved theme before the first paint, including the loading screen.
      (function () {
        var theme;
        try { theme = localStorage.getItem('bpop:theme'); } catch (e) {}
        var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.backgroundColor = dark ? '#121216' : '#fff';
        document.documentElement.style.setProperty('--boot-bg', dark ? '#121216' : '#fff');
        document.documentElement.style.setProperty('--boot-text', dark ? '#b3b3bf' : '#71717a');
        document.querySelector('meta[name="theme-color"]').content = dark ? '#121216' : '#FFFFFF';
      })();
    </script>
    <meta name="description" content="B-POP TAGS (Bangla Pop Tags) — curating pop-culture & the underground scene. Discover and host events across Bangladesh." />

    <title>B-POP TAGS | Curating Pop-Culture &amp; Underground Scene</title>

  <body class="bg-surface">
    <div id="root">
      <div id="boot" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; background: var(--boot-bg, #fff); color: var(--boot-text, #71717a); font: 500 15px/1.4 Inter, system-ui, sans-serif; text-align: center">
        <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true"><path d="M19.5 4.9 L34.4 23.3 L54.6 18.1 L43.6 34.8 L58.5 53.3 L36.8 45.2 L25.8 61.8 L23.3 40.1 L1.7 31.9 L21.9 26.6Z" fill="#FED7EF" stroke="#FA02A3" stroke-width="4" stroke-linejoin="round" /><path d="M25.6 22.4 L32.1 30.2 L40.8 28.1 L36.3 35.4 L42.5 43.4 L33.2 40.0 L28.3 47.1 L27.1 37.8 L17.9 34.1 L26.4 31.7Z" fill="#FA02A3" /></svg>
        <p style="margin: 0">Loading B-POP TAGS…</p>
        <button id="boot-retry" type="button" hidden style="border: 0; border-radius: 999px; padding: 12px 22px; background: #fa02a3; color: #fff; font: 600 15px Inter, system-ui, sans-serif; cursor: pointer">Still loading? Tap to reload</button>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
